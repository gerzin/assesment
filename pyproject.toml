# Python project configuration

[tool.ruff]
# Target Python 3.13
target-version = "py313"
line-length = 100

# Enable specific rule sets
lint.select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]

# Ignore specific rules
lint.ignore = [
    "E501",  # Line too long (handled by formatter)
]

# Exclude directories
exclude = [
    ".git",
    ".bazel*",
    "bazel-*",
    "__pycache__",
    "*.pyc",
    "build",
    "dist",
]

[tool.ruff.lint.isort]
known-first-party = ["ground_control", "onboard"]

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"
# Indent with spaces
indent-style = "space"
