name: CI

on:
  push:
    branches: [ main, develop, module/*, feature/* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Bazel
      uses: bazel-contrib/setup-bazel@0.8.1
      with:
        bazelisk-cache: true
        disk-cache: ${{ github.workflow }}
        repository-cache: true

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-format python3-pip gcc-13 g++-13
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-13 100
        sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-13 100
        pip3 install ruff

    - name: Cache Bazel
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/bazel
        key: ${{ runner.os }}-bazel-${{ hashFiles('**/BUILD.bazel', '**/MODULE.bazel') }}
        restore-keys: |
          ${{ runner.os }}-bazel-

    - name: Check C++ formatting
      run: bash ci/check_cpp_format.sh

    - name: Check Python formatting
      run: bash ci/check_python_format.sh

    - name: Build and test all targets
      run: bazel test //... --test_output=errors

    - name: Test summary
      if: always()
      run: |
        echo "## Test Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ -f bazel-testlogs/onboard/tests/onboard_test/test.log ]; then
          echo "### C++ Tests" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -20 bazel-testlogs/onboard/tests/onboard_test/test.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        fi
        if [ -f bazel-testlogs/ground_control/tests/test_shared_lib/test.log ]; then
          echo "### Python Tests" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -20 bazel-testlogs/ground_control/tests/test_shared_lib/test.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        fi
