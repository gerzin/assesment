name: CI

on:
  push:
    branches: [ main, develop, module/*, feature/* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Bazel
      uses: bazel-contrib/setup-bazel@0.8.1
      with:
        bazelisk-cache: true
        disk-cache: ${{ github.workflow }}
        repository-cache: true

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-format python3-pip
        pip3 install ruff

    - name: Cache Bazel
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/bazel
        key: ${{ runner.os }}-bazel-${{ hashFiles('**/BUILD.bazel', '**/MODULE.bazel') }}
        restore-keys: |
          ${{ runner.os }}-bazel-

    - name: Check C++ formatting
      run: bash ci/check_cpp_format.sh

    - name: Check Python formatting
      run: bash ci/check_python_format.sh

    - name: Build all targets
      run: bazel build //...

    - name: Run C++ tests
      run: bazel test //onboard/tests:onboard_test --test_output=errors

    - name: Run Python tests
      run: bazel test //ground_control:test_shared_lib --test_output=errors

    - name: Test summary
      if: always()
      run: |
        echo "## Test Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ -f bazel-testlogs/onboard/tests/onboard_test/test.log ]; then
          echo "### C++ Tests" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -20 bazel-testlogs/onboard/tests/onboard_test/test.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        fi
        if [ -f bazel-testlogs/ground_control/test_shared_lib/test.log ]; then
          echo "### Python Tests" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -20 bazel-testlogs/ground_control/test_shared_lib/test.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        fi
